<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Predictor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #38bdf8;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: 2px solid #38bdf8;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .result-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      background-color: #0f172a;
      text-align: center;
      display: none;
    }
    .weight-val {
      font-size: 1.75rem;
      font-weight: bold;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Weight Predictor</h2>
    <form id="predictForm">
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="form-group">
        <label for="height">Height (in inches)</label>
        <input type="number" id="height" step="0.1" placeholder="e.g. 70.5" required>
      </div>

      <button type="submit" id="submitBtn">Predict Weight</button>
    </form>

    <div class="result-box" id="resultBox">
      <span style="color: #94a3b8; font-size: 0.85rem;">Estimated Weight</span>
      <div class="weight-val" id="weightDisplay">-- kg</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('predictForm');
    const resultBox = document.getElementById('resultBox');
    const weightDisplay = document.getElementById('weightDisplay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const gender = document.getElementById('gender').value;
      const height = parseFloat(document.getElementById('height').value);

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ Gender: gender, Height: height })
        });

        if (!response.ok) {
          throw new Error('Prediction API failed');
        }

        const data = await response.json();
        weightDisplay.innerText = `${data.predicted_weight_kg} kg`;
        resultBox.style.display = 'block';

      } catch (err) {
        alert('Server error: ' + err.message);
      }
    });
  </script>
</body>
</html>
